<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Yara Al-Mansouri — Product Engineer, Designer, Researcher</title>
    <meta
      name="description"
      content="The bilingual portfolio of Dr. Yara Al-Mansouri: sixteen years of product engineering, design systems and Arabic interface research, readable in both directions."
    />
    <meta name="theme-color" content="#f3efe7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12110e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="Yara Al-Mansouri — يارا المنصوري" />
    <meta property="og:description" content="A portfolio that reads in both directions." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var lang = new URLSearchParams(location.search).get('lang');
        try {
          lang = lang || localStorage.getItem('yara.locale');
        } catch (error) {}
        if (lang === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
          document.documentElement.dataset.locale = 'ar';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="announcer" class="visually-hidden" aria-live="polite"></div>
    <noscript>
      <p class="noscript">Yara Saud Al-Mansouri, PhD — Principal Product Engineer, Design Technology Lead and HCI Researcher, Riyadh. This bilingual portfolio needs JavaScript to switch between English and Arabic.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
